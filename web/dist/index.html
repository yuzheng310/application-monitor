<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投递进度助手</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23254eda'/%3E%3Ctext x='7' y='29' font-size='27' fill='white'%3E投%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<header><div class="brand">投</div><div><h1>投递进度助手</h1><p id="schedule">正在读取定时安排</p></div><label class="workers">同时查询 <select id="workers" aria-label="并发公司数"><option value="1">1 家</option><option value="2">2 家</option><option value="4" selected>4 家（推荐）</option><option value="6">6 家</option><option value="8">8 家</option></select></label><button id="refresh" disabled>↻ 一键查询全部</button></header>
<main><details class="getting-started"><summary>第一次使用？查看使用说明</summary><p>① 软件已内置浏览器和查询依赖。请在本窗口点击下方各公司「官网」并自行登录。</p><p>② 登录后回到本页，点击「一键查询全部」。无需提交密码或导出 Cookie。</p><p>③ 查询期间保持内置浏览器打开。投递数据保存在本机，升级软件不会清空记录。</p><p>未登录、官网改版或无可读取的记录会显示失败提示，失败不会覆盖上次成功记录。</p></details><div class="topline"><p id="overview">正在读取投递记录…</p><span id="lastTime"></span></div><nav id="summary" aria-label="非实习岗位数量"></nav>
<div class="run-panel" role="status"><div><span id="runText">正在读取记录…</span><span id="runCount"></span></div><progress id="runProgress" hidden></progress><p id="notice"></p></div>
<div id="requestError" class="request-error" role="alert" hidden></div><div class="retry-toolbar"><button id="retryFailed" hidden>仅重试失败公司</button><span id="runStats"></span></div><div class="legend" aria-label="流程图例"><span>✓ 已完成</span><span>● 当前阶段</span><span>○ 后续阶段</span><span>未公开的完成情况单独注明</span></div><div id="groups"></div><footer>仅展示非实习岗位 · 流程名称与当前阶段以官网为准</footer></main></body></html>
